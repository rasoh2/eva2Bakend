<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Index - Menú Principal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <div class="container text-center mt-5">
        <div class="card shadow p-4 mx-auto" style="max-width: 600px;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <span class="badge bg-primary fs-6">
                    <i class="bi bi-person-circle"></i> {{ request.user.username }} (ID: {{ request.user.id }})
                </span>
                <a href="{% url 'cerrar_sesion' %}" class="btn btn-outline-danger btn-sm">
                    <i class="bi bi-box-arrow-right"></i> Cerrar sesión
                </a>
            </div>

            <h1 class="mb-4">Menú Principal</h1>
            <p class="text-muted">Sistema de Gestión de Productos</p>

            <div class="d-grid gap-3 mt-3">
                <a href="/form_registrar" class="btn btn-success btn-lg">
                    <i class="bi bi-plus-circle"></i> Ir Al Formulario de Registro
                </a>
                <a href="/listado" class="btn btn-primary btn-lg">
                    <i class="bi bi-table"></i> Ir Al Listado de Productos
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>
</html>
