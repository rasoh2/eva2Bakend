{% extends 'usuarios/base.html' %} {% block titulo %}Inicio de sesión{% endblock
%} {% block contenido %}
<h1>Iniciar sesión</h1>

<form method="post">
  {% csrf_token %}

  <label for="id_usuario">Nombre de usuario</label>
  <input type="text" id="id_usuario" name="username" required />

  <label for="id_contrasena">Contraseña</label>
  <input type="password" id="id_contrasena" name="password" required />

  <button type="submit">Ingresar</button>
</form>

<p>
  ¿No tienes una cuenta?
  <a href="{% url 'registrar_usuario' %}">Regístrate</a>
</p>
{% endblock %}
